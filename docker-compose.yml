services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: instagram_clone
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d instagram_clone"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  backend-1:
    build: ./backend
    env_file: ./backend/.env
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/instagram_clone
      REDIS_URL: redis://redis:6379
      TRUST_PROXY: 1

      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: instagram-media
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin123
      S3_PUBLIC_URL: http://localhost:9000/instagram-media

    expose:
      - "4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started

  backend-2:
    build: ./backend
    env_file: ./backend/.env
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/instagram_clone
      REDIS_URL: redis://redis:6379
      TRUST_PROXY: 1

      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: instagram-media
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin123
      S3_PUBLIC_URL: http://localhost:9000/instagram-media

    expose:
      - "4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started

  backend-3:
    build: ./backend
    env_file: ./backend/.env
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/instagram_clone
      REDIS_URL: redis://redis:6379
      TRUST_PROXY: 1

      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: instagram-media
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin123
      S3_PUBLIC_URL: http://localhost:9000/instagram-media

    expose:
      - "4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "4000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend-1
      - backend-2
      - backend-3

volumes:
  pgdata:
  miniodata: